[project]
name = "core"
version = "0.1.0"
description = "Core: orquestador de Planetary Explorer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "pandas>=2.1,<3",
    "openpyxl>=3.1,<4",
    "numpy>=1.26,<3",
    "rasterio>=1.3,<2",
    "pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
