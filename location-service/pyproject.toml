[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "location-service"
version = "0.1.0"
description = "Mars Location Service - Planetary Explorer microservice 01"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163,<1.0",
    "uvicorn>=0.54,<1.0",
    "pydantic>=2.14,<3.0",
    "pydantic-settings>=2.16,<3.0",
    "pyyaml>=6.0,<7.0",
    "rapidfuzz>=3.14,<4.0",
]

[project.optional-dependencies]
ingest = [
    "pandas>=3.1,<4.0",
    "openpyxl>=3.1,<4.0",
    "pyshp>=3.1,<4.0",
]
dev = [
    "pytest>=9.2,<10.0",
    "httpx>=0.28,<1.0",
    "types-PyYAML",
    "pytest-cov>=7.1,<8.0",
    "ruff>=0.17,<1.0",
    "mypy>=2.4,<3.0",
    "openapi-spec-validator>=0.9,<1.0",
]

[project.scripts]
location-ingest = "location_service.ingest.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/location_service"]
omit = ["src/location_service/ingest/*", "*/__main__.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008: FastAPI Depends()/Query() in argument defaults is the framework idiom
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
packages = ["location_service"]

[[tool.mypy.overrides]]
module = ["pandas.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "shapefile"]
ignore_missing_imports = true
