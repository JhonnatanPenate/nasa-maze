name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Corre pytest en cada servicio con pyproject.toml (+ extra [dev] con pytest), p. ej. terrain-analysis/, routing-engine/
      - name: Tests por servicio
        run: |
          set -e
          for svc in */pyproject.toml; do
            dir=$(dirname "$svc")
            echo "::group::$dir"
            python -m venv "/tmp/venv-$dir"
            "/tmp/venv-$dir/bin/pip" install -q -e "$dir[dev]"
            (cd "$dir" && "/tmp/venv-$dir/bin/pytest" -q)
            echo "::endgroup::"
          done

  # Builds every service image and checks that the container starts and answers its health endpoint
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - svc: location-service
            context: .
            port: 8001
            health: /ready
          - svc: raster-service
            context: raster-service
            port: 8003
            health: /health
            mounts: -v $PWD/data:/data:ro
          - svc: terrain-analysis
            context: terrain-analysis
            port: 8004
            health: /health
            mounts: -v $PWD/data:/data:ro
          - svc: core
            context: core
            port: 8000
            health: /api/health
            mounts: -v $PWD/data:/data:ro
            # No MS6 in the container: a default route proves the precalculated fallback reads the mounted data
            route: true
            route_path: /api/ruta
          - svc: routing-engine
            context: .
            port: 8006
            health: /health
            # Gale data is baked into the image; a default route proves it
            route: true
    name: docker (${{ matrix.svc }})
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.svc }}/Dockerfile
          tags: ${{ matrix.svc }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}
      - name: Smoke test
        run: |
          docker run -d --name svc -p ${{ matrix.port }}:${{ matrix.port }} ${{ matrix.mounts }} ${{ matrix.svc }}:ci
          # A "degraded" health (e.g. data not found) is a failure, not a pass
          for i in $(seq 1 60); do
            if body=$(curl -fsS "http://localhost:${{ matrix.port }}${{ matrix.health }}"); then
              echo "$body"
              echo "$body" | grep -qE '"status": ?"(ok|ready)"' || break
              echo "healthy after ~$((i * 2)) s"
              if [ "${{ matrix.route }}" = "true" ]; then
                curl -fsS -m 60 -o route.json -X POST "http://localhost:${{ matrix.port }}${{ matrix.route_path || '/route' }}" -H 'Content-Type: application/json' -d '{}' || { docker logs svc; exit 1; }
                head -c 300 route.json; echo
              fi
              exit 0
            fi
            sleep 2
          done
          docker logs svc
          exit 1
