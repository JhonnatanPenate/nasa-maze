[build-system]
requires = ["setuptools>=68,<69"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-engine"
version = "0.1.0"
description = "MS6 Routing Engine: ruta de costo mínimo hacia un mineral objetivo en Gale"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "numpy>=1.26,<3",
    "pandas>=2,<3",
    "openpyxl>=3.1,<4",
    "scipy>=1.11,<2",
    "rasterio>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
