[build-system]
requires = ["setuptools>=68,<69"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-assessment"
version = "0.1.0"
description = "MS5 Risk Assessment Service: normalized terrain + environmental risk for Mars paths"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7.0",
    "pandas>=3.1,<4",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7,<8",
    "httpx>=0.27,<1",
    "respx>=0.23,<1",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
    "openapi-spec-validator>=0.9,<1",
    "jsonschema>=4,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/ingest/*", "*/__main__.py"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008: FastAPI Depends()/Query() in argument defaults is the framework idiom
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
mypy_path = "."
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["yaml", "pandas.*", "openpyxl.*"]
ignore_missing_imports = true
