[build-system]
requires = ["setuptools>=68,<69"]
build-backend = "setuptools.build_meta"

[project]
name = "raster-service"
version = "0.1.0"
description = "MS3 Raster Service: single HTTP access point to Mars raster files"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "numpy>=1.26,<3",
    "rasterio>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
