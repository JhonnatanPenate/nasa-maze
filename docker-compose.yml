# Stack completo de Planetary Explorer. Desde la raíz del repo:
#   docker compose up --build            # Core en http://localhost:8000/docs
#
# location-service necesita su catálogo semilla (ignorado por git). Generarlo una vez:
#   pip install ./location-service
#   python -m location_service.ingest build --mission data/gale/processed/gale_puntos_quimica.xlsx \
#     --config location-service/config --out location-service/data/seed/location_catalog_seed.sqlite \
#     --report location-service/data/seed/ingest_report.json
# Sin ese catálogo, location-service queda unhealthy pero el Core sigue funcionando (degraded != down).
services:
  frontend:
    build: ./nasa-maze-app
    ports: ["8080:80"]
    depends_on:
      - core

  core:
    build: ./core
    ports: ["8000:8000"]
    environment:
      CORE_DATA_DIR: /data/gale
      CORE_MS6_URL: http://routing-engine:8006
      CORE_MS5_URL: http://risk-assessment:8005
      CORE_MS4_URL: http://terrain-analysis:8004
      CORE_MS1_URL: http://location-service:8001
    volumes:
      - ./data:/data:ro

  routing-engine:
    build:
      context: .
      dockerfile: routing-engine/Dockerfile
    ports: ["8006:8006"]

  terrain-analysis:
    build: ./terrain-analysis
    ports: ["8004:8004"]
    volumes:
      - ./data:/data:ro

  raster-service:
    build: ./raster-service
    ports: ["8003:8003"]
    volumes:
      - ./data:/data:ro

  risk-assessment:
    build: ./risk-assessment
    ports: ["8005:8005"]
    environment:
      RISK_DATASOURCE_MODE: http
      RISK_RASTER_BASE_URL: http://raster-service:8003
      RISK_TERRAIN_BASE_URL: http://terrain-analysis:8004
      RISK_SEED_CATALOG_PATH: /app/data/seed/risk_catalog_seed.sqlite
      RISK_CONFIG_DIR: /app/config
      # MS4 tarda ~6 s en perfilar una ruta completa (7.7 km); con el default de 5 s MS5 responde 502
      RISK_UPSTREAM_TIMEOUT_S: "60"
    volumes:
      - ./risk-assessment/data/seed:/app/data/seed:ro
      - ./risk-assessment/config:/app/config:ro

  location-service:
    build: ./location-service
    ports: ["8001:8001"]
    volumes:
      - ./location-service/data/seed:/app/data/seed:ro
      - ./location-service/config:/app/config:ro
